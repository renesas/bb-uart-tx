# Meson native file for LLVM clang-cl (Windows/MSVC-style driver)
# Usage (from a Developer Command Prompt OR with VS Build Tools installed):
#   meson setup build-clangcl --wipe --native-file meson\llvm-clangcl-msvc.ini
#   meson compile -C build-clangcl
#   meson test -C build-clangcl -v

[binaries]
c = 'clang-cl.exe'
cpp = 'clang-cl.exe'
ar = 'llvm-lib.exe'

c_ld = 'lld-link.exe'
cpp_ld = 'lld-link.exe'

[properties]
needs_exe_wrapper = false

[built-in options]
# Flags must be on a single line — the Meson machine file parser does not
# accept multi-line arrays.
#
# /clang:-D_Noreturn=
#   LLVM 22 / Windows SDK noreturn clash fix. stdnoreturn.h defines
#   'noreturn' as '_Noreturn'; stdlib.h then uses __declspec(noreturn)
#   which expands to __declspec(_Noreturn) — rejected by clang-cl.
#   Defining _Noreturn= neutralises the chain.
#
# NOTE: project-specific macros (RS_BB_UART_TX_TEST_HOST_BUILD, ...) are
# deliberately NOT set here.  They live in tests/meson.build (host_test_cargs)
# so that EVERY native toolchain file — this one, the Linux CI one, or a
# developer's own — builds the host tests identically.
c_args = ['/clang:-D_Noreturn=']
