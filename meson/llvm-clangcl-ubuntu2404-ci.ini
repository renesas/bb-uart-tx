# Meson native file for LLVM clang + lld on Ubuntu 24.04 (host unit tests / CI)
# Usage:
#   meson setup build-clang --wipe --native-file ./meson/llvm-clangcl-ubuntu2404-ci.ini
#   meson compile -C build-clang
#   meson test -C build-clang -v
#
# No project macros are needed here: tests/meson.build (host_test_cargs)
# supplies RS_BB_UART_TX_TEST_HOST_BUILD and friends for every native file.

[binaries]
c = 'clang'
cpp = 'clang'
# ar = 'llvm-ar'

c_ld = 'lld'
cpp_ld = 'lld'

[properties]
needs_exe_wrapper = false
