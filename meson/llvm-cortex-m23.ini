# Meson cross file for LLVM ATfE (Arm Toolchain for Embedded) — Cortex-M23 (FPB-RA2E3)
# Sibling of meson/llvm-cortex-m33.ini: same structure, M23 CPU flags, M23 multilib.
#
# >>> EDIT BEFORE USE <<<
# 1. Replace every 'C:/Users/MyPC/.../ATfE-21.1.1-Windows-x86_64' below with YOUR
#    ATfE root (copy the paths from your working meson/llvm-cortex-m33.ini —
#    they are the same toolchain).
# 2. Set MULTILIB (last occurrence, in c_link_args) to the directory clang picks
#    for this CPU.  Print it with:
#
#      clang --target=arm-none-eabi -mcpu=cortex-m23 -mthumb -mfloat-abi=soft -Os -print-multi-directory
#
#    (run the ATfE clang.exe).  Verify the folder exists under
#    <ATfE root>\lib\clang-runtimes\arm-none-eabi\<that name>\lib
#    The placeholder below (armv8m.base_soft_nofp) is the usual base name; ATfE
#    may append suffixes such as _unaligned / _size, exactly like the M33 file's
#    'armv8m.main_hard_fp_unaligned_size'.
#
# NOTE: c_args and c_link_args must be on a single line each — the Meson
# machine file parser does not accept multi-line arrays.
#
# --sysroot is in c_args (needed for setjmp.h, string.h, ... headers) but is
# intentionally OMITTED from c_link_args: with it, lld auto-includes
# picolibc.ld, which references crt0.o and ENTRY(_start).  The FSP provides its
# own linker script (fsp.lld) and startup (Reset_Handler).  Without a sysroot at
# COMPILE time ATfE finds no libc headers ("'setjmp.h' file not found").
#
# Flags follow the RASC-generated GeneratedCfg.cmake of the FPB-RA2E3 example
# (Cortex-M23 has no FPU: no -mfloat-abi/-mfpu; -fsigned-char as RASC emits).

[binaries]
c       = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/clang.exe'
ar      = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-ar.exe'
strip   = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-strip.exe'
objcopy = 'C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/bin/llvm-objcopy.exe'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m23'
endian = 'little'

[built-in options]
c_args = ['--target=arm-none-eabi', '-mcpu=cortex-m23', '-mthumb', '-mlittle-endian', '-ffunction-sections', '-fdata-sections', '-fno-strict-aliasing', '-fmessage-length=0', '-fsigned-char', '-g3', '-std=c99', '-fshort-enums', '-fno-unroll-loops', '-Wunused', '-Wuninitialized', '-Wall', '-Wextra', '-Wmissing-declarations', '-Wconversion', '-Wpointer-arith', '-Wshadow', '-Waggregate-return', '-Wno-parentheses-equality', '-Wfloat-equal', '-Os', '--sysroot=C:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/lib/clang-runtimes/arm-none-eabi']
c_link_args = ['--target=arm-none-eabi', '-mcpu=cortex-m23', '-mthumb', '-mlittle-endian', '-Wl,--gc-sections', '-Wl,--icf=none', '-nodefaultlibs', '-Wl,-LC:/Users/MyPC/AppData/Local/Programs/Renesas/RA/e2studio_v2025-12_fsp_v6.4.0/toolchains/llvm_arm/ATfE-21.1.1-Windows-x86_64/lib/clang-runtimes/arm-none-eabi/armv8m.base_soft_nofp/lib', '-lc', '-lclang_rt.builtins']
